<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-sobache-serdce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b0d"/>
      <stop offset="60%" stop-color="#0f0803"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Golden Spine Shadow -->
    <linearGradient id="spine-shadow-sobache-serdce" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="accent-grad-sobache-serdce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="600" fill="url(#bg-grad-sobache-serdce)"/>

  <!-- Ornate Decorative Outer & Inner Border -->
  <rect x="18" y="18" width="364" height="564" rx="12" fill="none" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="24" y="24" width="352" height="552" rx="8" fill="none" stroke="#F97316" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.35"/>

  <!-- Corner Flourishes -->
  <path d="M 24 40 L 40 40 L 40 24" fill="none" stroke="#F97316" stroke-width="2"/>
  <path d="M 376 40 L 360 40 L 360 24" fill="none" stroke="#F97316" stroke-width="2"/>
  <path d="M 24 560 L 40 560 L 40 576" fill="none" stroke="#F97316" stroke-width="2"/>
  <path d="M 376 560 L 360 560 L 360 576" fill="none" stroke="#F97316" stroke-width="2"/>

  <!-- Top Badge: Audiobook & Series -->
  <g transform="translate(200, 48)">
    <rect x="-80" y="-14" width="160" height="22" rx="11" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-width="1"/>
    <text x="0" y="2" font-family="'Manrope', system-ui, sans-serif" font-size="9" font-weight="800" fill="#FED7AA" text-anchor="middle" letter-spacing="2">АУДИОКНИГА • PRO</text>
  </g>

  <!-- Subtitle Badge -->
  <text x="200" y="80" font-family="'Manrope', system-ui, sans-serif" font-size="10" font-weight="700" fill="#F97316" text-anchor="middle" letter-spacing="2.5">КУЛЬТОВАЯ ПОВЕСТЬ</text>

  <!-- Author Name -->
  <text x="200" y="105" font-family="'Manrope', system-ui, sans-serif" font-size="13" font-weight="800" fill="#FED7AA" text-anchor="middle" letter-spacing="3">МИХАИЛ БУЛГАКОВ</text>

  <!-- Title Lines -->
  <text x="200" y="135" font-family="Georgia, serif" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">СОБАЧЬЕ СЕРДЦЕ</text>


  <!-- Decorative Separator Line -->
  <g transform="translate(200, 190)">
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#F97316" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#F97316"/>
  </g>

  <!-- Book Art / Vector Centerpiece -->
  <g>
    
        <!-- Dog & Scalpel / Medical Cross -->
        <circle cx="200" cy="280" r="50" fill="#F97316" opacity="0.15"/>
        <!-- Medical cross -->
        <rect x="193" y="235" width="14" height="40" rx="3" fill="#F97316" opacity="0.6"/>
        <rect x="180" y="248" width="40" height="14" rx="3" fill="#F97316" opacity="0.6"/>
        <!-- Dog head silhouette -->
        <path d="M 175 315 L 185 285 L 195 285 L 205 295 L 225 295 L 230 305 L 215 318 L 195 320 Z" fill="#0f0803" stroke="#FED7AA" stroke-width="2"/>
        <circle cx="195" cy="292" r="3" fill="#F97316"/>
        <!-- Scalpel -->
        <line x1="160" y1="260" x2="240" y2="300" stroke="#FED7AA" stroke-width="3" stroke-linecap="round"/>
        
  </g>

  <!-- Lower Divider -->
  <g transform="translate(200, 395)">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#F97316" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="3" fill="#F97316"/>
  </g>

  <!-- Genre Tag -->
  <text x="200" y="420" font-family="'Manrope', system-ui, sans-serif" font-size="10" font-weight="700" fill="#F97316" text-anchor="middle" letter-spacing="2.5">ФАНТАСТИКА &amp; САТИРА</text>

  <!-- Narrator Info Block -->
  <g transform="translate(200, 455)">
    <rect x="-120" y="-18" width="240" height="38" rx="10" fill="#000000" fill-opacity="0.65" stroke="#F97316" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Mini Microphone Icon -->
    <path d="M -102 -3 C -102 -7 -99 -10 -95 -10 C -91 -10 -88 -7 -88 -3 L -88 2 C -88 6 -91 9 -95 9 C -99 9 -102 6 -102 2 Z" fill="#F97316"/>
    <path d="M -105 1 C -105 7 -95 12 -95 12 C -95 12 -85 7 -85 1" fill="none" stroke="#F97316" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-95" y1="12" x2="-95" y2="16" stroke="#F97316" stroke-width="1.5"/>

    <text x="-76" y="-3" font-family="'Manrope', system-ui, sans-serif" font-size="9" font-weight="600" fill="#94A3B8">Читает мастер слова:</text>
    <text x="-76" y="11" font-family="'Manrope', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Вениамин Смехов</text>
  </g>

  <!-- Quality Stamp / Footnote -->
  <g transform="translate(200, 525)">
    <text x="0" y="0" font-family="'Manrope', system-ui, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ПОЛНАЯ ВЕРСИЯ • БЕЗ СОКРАЩЕНИЙ</text>
    <text x="0" y="16" font-family="'Manrope', system-ui, sans-serif" font-size="9" font-weight="800" fill="#F97316" text-anchor="middle" letter-spacing="2">СТУДИЙНОЕ КАЧЕСТВО 192 KBPS</text>
  </g>

  <!-- Spine 3D Book Shadow Effect -->
  <rect x="0" y="0" width="28" height="600" fill="url(#spine-shadow-sobache-serdce)"/>
</svg>
